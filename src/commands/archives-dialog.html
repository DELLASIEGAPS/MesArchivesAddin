<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes Archives BdF</title>
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <script src="../archives-config.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: "Segoe UI", sans-serif; margin: 0; padding: 12px 16px; background: #fafafa; display: flex; flex-direction: column; overflow: hidden; }
    header, .viewer-options, .footer { flex: 0 0 auto; }
    h2 { margin: 0 0 4px; font-size: 18px; }
    .sub { font-size: 12px; color: #666; margin-bottom: 14px; }
    #list { display: flex; gap: 10px; }
    .tile { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; background: #fff;
            border: 2px solid #c62828; border-radius: 8px; padding: 12px 6px; text-align: center; }
    .tile.on { border-color: #2e7d32; }
    .tile.unknown { border-color: #777; }
    .tile.unknown img { filter: grayscale(1); }
    .tile img { width: 48px; height: 48px; }
    .year { font-weight: 600; font-size: 15px; }
    .state { font-size: 12px; font-weight: 600; color: #c62828; }
    .tile.on .state { color: #2e7d32; }
    .tile.unknown .state { color: #777; }
    .detail { font-size: 11px; color: #888; height: 42px; overflow: hidden; }
    button { width: 100%; padding: 7px 4px; border: 0; border-radius: 4px; color: #fff; cursor: pointer;
             font-size: 12px; font-weight: 600; background: #c62828; }
    .tile.on button { background: #2e7d32; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #msg { min-height: 18px; margin-top: 4px; font-size: 12px; color: #b26a00; }
    .footer { margin-top: 12px; display: flex; justify-content: space-between; }
    .footer button { width: auto; min-width: 80px; padding: 7px 12px; background: #555; }
    .viewer-options { display: flex; align-items: center; gap: 16px; margin-top: 10px; }
    .viewer-options button { width: auto; padding: 7px 12px; background: #555; }
    .viewer-link { font-size: 13px; }
    #viewer-panel { margin-top: 8px; flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
    #viewer-panel p { margin: 0 0 6px; font-size: 12px; }
    #viewer-frame { display: block; width: 100%; flex: 1 1 0; min-height: 0; border: 1px solid #ccc; background: #fff; }
    #progress { flex: 0 0 auto; font-size: 12px; }
    #progress progress { width: 100%; height: 8px; }
    #progress-steps { margin: 2px 0; padding-left: 20px; display: flex; flex-wrap: wrap; gap: 4px 20px; }
    [hidden] { display: none !important; }
    @media (max-height: 500px) { .tile img { width: 24px; height: 24px; } .tile { padding: 4px; gap: 2px; } .detail { height: 28px; } }
  </style>
</head>
<body>
  <header>
  <h2>Mes Archives</h2>
  <div id="mode-hint" class="sub"></div>
  <div id="list"></div>
  </header>
  <div id="msg"></div>
  <section id="progress" aria-label="Progression de l'opération" aria-live="polite" hidden>
    <div id="progress-label"></div>
    <progress id="progress-bar" value="0" max="1"></progress>
    <ol id="progress-steps"></ol>
  </section>
  <div class="viewer-options">
    <button id="viewer-toggle" type="button" aria-expanded="false">Afficher le visualiseur ici</button>
    <a id="agent-view" class="viewer-link" target="_blank" rel="noopener noreferrer">Ouvrir dans un onglet séparé</a>
  </div>
  <section id="viewer-panel" hidden>
    <p>Si le visualiseur ne s'affiche pas, vérifiez l'agent local ou utilisez l'onglet séparé.</p>
    <iframe id="viewer-frame" title="Visualiseur des archives locales" sandbox="allow-scripts allow-same-origin allow-downloads allow-top-navigation-by-user-activation allow-popups allow-popups-to-escape-sandbox"></iframe>
  </section>
  <div class="footer">
    <button id="modop" type="button">Modop</button>
    <button id="refresh" type="button">Actualiser</button>
    <button id="close" type="button">Fermer</button>
  </div>
  <script>
    const PST_AGENT = "http://127.0.0.1:45731";
    const CONFIG = window.MES_ARCHIVES_CONFIG || {};
    const ARCHIVES = { "2021": "ADR_2021.pst", "2022": "ADR_2022.pst", "2023": "ADR_2023.pst", "2024": "ADR.pst" };
    const isWeb = () => Office.context.platform === Office.PlatformType.OfficeOnline;
    // Nom affiché dans le volet de dossiers d'Outlook.
    const DISPLAY_NAMES = { "2021": "Archives 2021", "2022": "Archives 2022", "2023": "Archives 2023", "2024": "Archives 2024" };
    const states = {};
    const details = {};
    const busy = {};
    let refreshing = false;
    let refreshPending = false;
    let officeReady = false;
    const listEl = document.getElementById("list");
    const msgEl = document.getElementById("msg");
    const viewerLink = document.getElementById("agent-view");
    const viewerToggle = document.getElementById("viewer-toggle");
    const viewerPanel = document.getElementById("viewer-panel");
    const viewerFrame = document.getElementById("viewer-frame");
    const progressEl = document.getElementById("progress");
    const progressLabel = document.getElementById("progress-label");
    const progressBar = document.getElementById("progress-bar");
    const progressSteps = document.getElementById("progress-steps");
    const modeHint = document.getElementById("mode-hint");
    let progressTimer;
    let operationSteps = [];
    let completedSteps = 0;
    function beginProgress(steps) {
      clearTimeout(progressTimer);
      operationSteps = steps;
      completedSteps = 0;
      progressEl.hidden = false;
      progressLabel.textContent = "Opération en cours…";
      progressBar.max = steps.length;
      updateProgress(0);
      progressTimer = setTimeout(() => { progressLabel.textContent = "Veuillez patienter, opération en cours…"; }, 1000);
    }
    function updateProgress(completed) {
      completedSteps = completed;
      progressBar.value = completed;
      progressSteps.textContent = "";
      operationSteps.forEach((step, index) => {
        const item = document.createElement("li");
        item.textContent = (index < completed ? "✓ " : index === completed ? "En cours : " : "À venir : ") + step;
        progressSteps.appendChild(item);
      });
    }
    function endProgress(success) {
      clearTimeout(progressTimer);
      if (success) updateProgress(operationSteps.length);
      progressLabel.textContent = success ? "Opération terminée." : "Opération interrompue ; consultez le message ci-dessous.";
    }
    viewerPanel.hidden = true;
    viewerLink.href = CONFIG.agentViewUrl || PST_AGENT + "/view";

    function setViewerExpanded(expanded) {
      viewerPanel.hidden = !expanded;
      viewerToggle.setAttribute("aria-expanded", String(expanded));
      viewerToggle.textContent = expanded ? "Masquer le visualiseur" : "Afficher le visualiseur ici";
      if (expanded && !viewerFrame.getAttribute("src")) viewerFrame.src = viewerLink.href;
    }
    viewerToggle.addEventListener("click", () => setViewerExpanded(viewerPanel.hidden));
    window.addEventListener("message", (event) => {
      if (event.origin === new URL(viewerLink.href).origin &&
          event.source === viewerFrame.contentWindow &&
          event.data && event.data.type === "close-local-viewer") {
        setViewerExpanded(false);
      }
    });

    function render() {
      modeHint.textContent = isWeb()
        ? "Mode web : vert = marqueur cloud actif ; le PST n'est pas monté dans Outlook Web."
        : "Mode Outlook classique : vert = PST monté dans Outlook.";
      listEl.textContent = "";
      Object.keys(ARCHIVES).forEach((year) => {
        const on = states[year] === true;
        const unknown = typeof states[year] !== "boolean";
        const tile = document.createElement("div");
        tile.className = "tile" + (unknown ? " unknown" : on ? " on" : "");
        const img = document.createElement("img");
        img.alt = "";
        img.src = "../MesArchives_" + (on ? "green" : "red") + "_80.png";
        const y = document.createElement("div");
        y.className = "year";
        y.textContent = year;
        const s = document.createElement("div");
        s.className = "state";
        s.textContent = unknown ? "État inconnu" : on ? "Disponible" : "Indisponible";
        const d = document.createElement("div");
        d.className = "detail";
        d.textContent = details[year] || "";
        const btn = document.createElement("button");
        btn.type = "button";
        btn.disabled = unknown || Object.values(busy).some(Boolean) || refreshing;
        btn.textContent = isWeb()
          ? (on ? "Retirer le marqueur web" : "Activer côté web")
          : (on ? "Décharger" : "Charger");
        btn.addEventListener("click", () => toggle(year));
        tile.append(img, y, s, d, btn);
        listEl.appendChild(tile);
      });
    }

    async function agent(route, year) {
      const resp = await fetch(PST_AGENT + route, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ fileName: ARCHIVES[year], displayName: DISPLAY_NAMES[year] }),
        signal: AbortSignal.timeout(route === "/mount-pst" ? 600000 : 60000)
      });
      const data = await resp.json();
      if (!resp.ok || data.ok === false) throw new Error(data.error || "Agent PST : HTTP " + resp.status);
      if (data.ok !== true) throw new Error("Réponse inattendue de l'agent PST.");
      return data;
    }

    async function agentState(year) {
      const d = await agent("/state", year);
      if (typeof d.exists !== "boolean" || typeof d.mounted !== "boolean") {
        throw new Error("État invalide renvoyé par l'agent PST.");
      }
      const state = {
        exists: d.exists === true,
        mounted: d.exists === true && d.mounted === true,
        local: typeof d.local === "boolean" ? d.local : d.exists === true,
        cloud: d.cloud === true ? true : null,
        outlookClosed: d.outlookRunning === false
      };
      return state;
    }

    function webStatusUrl(year) {
      if (!CONFIG.webStatusEndpoint) {
        throw new Error("Flux de statut cloud non configuré (webStatusEndpoint).");
      }
      const url = new URL(CONFIG.webStatusEndpoint);
      url.searchParams.set("year", year);
      return url.toString();
    }

    async function webState(year) {
      const resp = await fetch(webStatusUrl(year), {
        headers: { Accept: "application/json" },
        signal: AbortSignal.timeout(60000)
      });
      const data = await resp.json();
      if (!resp.ok || data.ok === false) throw new Error(data.error || "Flux de statut cloud : HTTP " + resp.status);
      if (typeof data.fileExists !== "boolean" || typeof data.mounted !== "boolean") {
        throw new Error("État invalide renvoyé par le flux cloud.");
      }
      return { exists: data.fileExists, mounted: data.mounted, local: null, cloud: data.fileExists };
    }

    async function setWebMarker(year, mounted) {
      const url = new URL(CONFIG.webStatusEndpoint);
      const resp = await fetch(url.toString(), {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=UTF-8", Accept: "application/json" },
        body: JSON.stringify({ annee: year, Monte: mounted }),
        signal: AbortSignal.timeout(60000)
      });
      const data = await resp.json();
      if (!resp.ok || data.ok !== true) throw new Error(data.error || "Mise à jour du marqueur cloud impossible (HTTP " + resp.status + ").");
    }

    const readState = (year) => isWeb() ? webState(year) : agentState(year);

    function presenceDetail(state) {
      if (isWeb()) {
        if (!state.exists) return "PST absent de OneDrive ; aucun marqueur web.";
        return state.mounted
          ? "Marqueur web actif ; le PST n'est pas monté dans Outlook Web."
          : "PST présent dans OneDrive ; marqueur web inactif.";
      }
      const text = presenceText(state);
      return state.outlookClosed && !state.mounted ? text + " (Outlook fermé)" : text;
    }

    function presenceText(state) {
      if (state.mounted) return "Monté dans Outlook";
      if (state.local === null) return state.cloud ? "PST présent dans OneDrive cloud (local non vérifié)" : "PST introuvable dans le cloud (local non vérifié)";
      if (state.cloud === null) return state.local ? "PST présent en local (cloud non vérifié)" : "PST introuvable en local (cloud non vérifié)";
      if (state.local && state.cloud) return "PST présent en local et dans OneDrive cloud";
      if (state.local) return "PST présent en local uniquement, absent du cloud";
      if (state.cloud) return "PST présent dans le cloud uniquement, absent en local : attendez la synchronisation OneDrive";
      return "PST introuvable en local et dans le cloud";
    }

    async function refreshStates() {
      if (refreshing || Object.values(busy).some(Boolean)) {
        refreshPending = true;
        return;
      }
      refreshPending = false;
      refreshing = true;
      beginProgress(Object.keys(ARCHIVES).map((year) => "Vérifier l'archive " + year));
      msgEl.textContent = "Vérification des archives…";
      render();
      let failed = false;
      let lastError = "";
      for (const year of Object.keys(ARCHIVES)) {
        try {
          const state = await readState(year);
          states[year] = state.mounted;
          details[year] = presenceDetail(state);
        } catch (error) {
          delete states[year];
          details[year] = "Vérification impossible";
          failed = true;
          lastError = error && error.message ? error.message : String(error);
          console.error("État de l'archive " + year + " indisponible.", error);
        }
        updateProgress(completedSteps + 1);
      }
      msgEl.textContent = failed
        ? (isWeb()
          ? (lastError.includes("webStatusEndpoint")
            ? "État web indisponible : configurez le flux cloud de statut."
            : "État web indisponible : vérifiez le flux Power Automate et son accès réseau.")
          : "État indisponible : lancez l'agent PST local puis cliquez sur Actualiser.")
        : "";
      refreshing = false;
      endProgress(!failed);
      render();
      if (refreshPending) refreshStates();
    }

    async function toggle(year) {
      if (refreshing || Object.values(busy).some(Boolean) || typeof states[year] !== "boolean") return;
      const previous = states[year];
      const target = !(states[year] === true);
      busy[year] = true;
      beginProgress(isWeb()
        ? ["Vérifier le marqueur cloud", target ? "Activer le marqueur web" : "Retirer le marqueur web", "Confirmer le marqueur cloud"]
        : ["Vérifier l'état dans Outlook", target ? "Charger l'archive" : "Décharger l'archive", "Confirmer l'état dans Outlook"]);
      msgEl.textContent = "";
      details[year] = isWeb()
        ? (target ? "Activation du marqueur web…" : "Retrait du marqueur web…")
        : (target ? "Chargement en cours…" : "Déchargement en cours…");
      render();
      try {
        const st = await readState(year);
        if (st.mounted !== previous) throw new Error(isWeb()
          ? "Le marqueur cloud a changé. Cliquez sur Actualiser."
          : "L'état a changé dans Outlook. Cliquez sur Actualiser.");
        if (target && !st.exists) throw new Error(isWeb()
          ? "PST introuvable dans OneDrive (" + ARCHIVES[year] + ")."
          : (st.cloud === true
            ? "PST présent uniquement dans le cloud (" + ARCHIVES[year] + ") : attendez la synchronisation OneDrive locale."
            : "PST introuvable (" + ARCHIVES[year] + ") en local" + (st.cloud === false ? " et dans le cloud" : "") + ", vérifiez OneDrive."));
        updateProgress(1);
        if (isWeb()) await setWebMarker(year, target);
        else await agent(target ? "/mount-pst" : "/unmount-pst", year);
        updateProgress(2);
        const confirmed = await readState(year);
        if (confirmed.mounted !== target) throw new Error(isWeb()
          ? "Le flux cloud ne confirme pas la mise à jour du marqueur."
          : "L'état dans Outlook ne confirme pas l'opération.");
        states[year] = confirmed.mounted;
        details[year] = presenceDetail(confirmed);
        Office.context.ui.messageParent(JSON.stringify({ type: "states", states }));
        endProgress(true);
      } catch (e) {
        endProgress(false);
        delete states[year];
        details[year] = "État à vérifier";
        const reason = e.name === "TypeError"
            ? (isWeb() ? "flux cloud inaccessible." : "agent PST local injoignable (127.0.0.1:45731).")
          : e.message;
        msgEl.textContent = year + " : " + reason + " Cliquez sur Actualiser.";
      }
      busy[year] = false;
      render();
      if (refreshPending) refreshStates();
    }

    document.getElementById("modop").addEventListener("click", () => window.open("https://dellasiegaps.github.io/MesArchivesAddin/docs/Fiche%20pratique%20-%20Exchange%20Online.pdf", "_blank", "noopener"));
    document.getElementById("refresh").addEventListener("click", refreshStates);
    document.addEventListener("visibilitychange", () => {
      if (officeReady && document.visibilityState === "visible") refreshStates();
    });
    window.addEventListener("focus", () => {
      if (officeReady && document.visibilityState === "visible") refreshStates();
    });
    document.getElementById("close").addEventListener("click", () => {
      try {
        Office.context.ui.messageParent(JSON.stringify({ type: "close" }));
      } catch (error) {
        console.error("Fermeture de la fenêtre impossible.", error);
        msgEl.textContent = "Impossible de fermer cette fenêtre automatiquement. Utilisez la croix en haut à droite.";
      }
    });
    render();
    Office.onReady(() => {
      officeReady = true;
      return refreshStates();
    });
  </script>
</body>
</html>
