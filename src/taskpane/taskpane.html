<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes Archives</title>
  <link rel="stylesheet" href="taskpane.css">
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <script src="../archives-config.js"></script>
</head>
<body>
  <main>
    <header>
      <img src="../MesArchives_VSTO_32.png" alt="" width="32" height="32">
      <div>
        <h1>Mes Archives</h1>
        <p>État des archives PST</p>
      </div>
    </header>
    <section id="archives" aria-live="polite"></section>

  </main>
  <script src="taskpane.js"></script>
