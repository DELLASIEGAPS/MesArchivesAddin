<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes Archives</title>
  <link rel="stylesheet" href="taskpane.css">
  <script src="../archives-config.js"></script>
</head>
<body>
  <main>
    <header>
      <img src="../MesArchives_red_32.png" alt="" width="32" height="32">
      <div>
        <h1>Mes Archives</h1>
        <p>État des archives PST</p>
      </div>

    <section id="archives" aria-live="polite"></section>

  <script src="taskpane.js"></script>
