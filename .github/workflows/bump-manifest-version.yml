name: Bump manifest version
on:
  push:
    branches: [main]
    paths: ["manifest.xml", "src/**"]
permissions:
  contents: write
jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version 2.YY.MMDD.HHMM
        run: |
          V="2.$(date -u +%y).$(date -u +%m%d).$(date -u +%H%M)"
          sed -i "s#<Version>[^<]*</Version>#<Version>${V}</Version>#" manifest.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: manifest version ${V}" && git push || true
